<!DOCTYPE html>
<html class="page" lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SurGU Календарь</title>
		<link rel="stylesheet" href="./css/main.css" />
	</head>
	<body class="page__body">
		<div class="container">
			<header class="header">
				<a class="header__logo">
					<img src="./img/logo-surgu-calendar.svg" alt="СурГУ Календарь" width="148" heihgt="30" />

					<span class="menu-btn__icon"></span>

		</div>

		<main class="main container">
			<section class="slogan">
				<p class="slogan__badge">

				</p>
				<h1 class="slogan__title">

				<p class="slogan__subtitle">вводи свою группу с подгруппой или фамилию преподавателя</p>
				<form class="search-form">
					<button type="submit" class="search-form__button"></button>

			</section>
		</main>
